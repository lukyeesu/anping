name: Build Android APK (Anping Card Agent)

on:
  workflow_dispatch: # กดปุ่มสั่ง Build ได้เองจากหน้า GitHub Actions ทุกเมื่อ
  push:
    paths:
      - 'android-card-agent/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Anping Card Agent APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: Bundle Webview Assets
        run: node scripts/build-webview.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android-card-agent/gradlew

      - name: Build Android APK
        run: |
          cd android-card-agent
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anping-card-agent-apk
          path: |
            android-card-agent/.work/app-build/outputs/apk/**/*.apk
            android-card-agent/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
