name: Build Android APK (Anping Card Agent)

on:
  workflow_dispatch: # กดปุ่มสั่ง Build ได้เองจากหน้า GitHub Actions ทุกเมื่อ
  push:
    paths:
      - 'android-card-agent/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Anping Card Agent APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android-card-agent/gradlew

      - name: Build Debug APK
        run: |
          cd android-card-agent
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anping-card-agent-apk
          path: android-card-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
